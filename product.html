<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Green Angan | Product Details</title>
<style>
:root{--green:#006b4f;--green-dark:#004d3a;--yellow:#ffd814;--orange:#ff9900;--nav:#063d30;--bg:#eaeded;--border:#d5d9d9;--muted:#667085}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;background:var(--bg);color:#17202a}
.header{background:var(--nav);color:#fff;position:sticky;top:0;z-index:10}.header-inner{max-width:1500px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:18px}
.logo{font-size:21px;font-weight:900;cursor:pointer}.logo span{color:#9ff0c9}.back{margin-left:auto;background:#fff;border:0;padding:10px 16px;border-radius:5px;font-weight:800;cursor:pointer}
.page{max-width:1500px;margin:auto;padding:18px}.box{background:#fff;border:2px solid var(--border);padding:22px}
.layout{display:grid;grid-template-columns:48% 52%;gap:28px}.main-image{height:500px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;padding:18px}.main-image img{max-width:100%;max-height:100%;object-fit:contain}
.thumbs{display:flex;gap:9px;overflow-x:auto;padding:12px 0}.thumb{width:70px;height:70px;object-fit:contain;border:1px solid #bbb;padding:4px;cursor:pointer;flex:0 0 auto}.thumb.active,.thumb:hover{border:2px solid var(--green)}
.title{font-size:28px;line-height:1.3;margin:0 0 8px}.brand{color:#007185;font-size:14px;margin-bottom:8px}.rating{display:inline-block;background:var(--green);color:#fff;padding:5px 9px;border-radius:3px;font-size:12px;font-weight:800;margin:4px 0 12px}
.price{font-size:32px;font-weight:900}.old{font-size:14px;color:var(--muted);text-decoration:line-through;margin-left:8px}.discount{font-size:14px;color:#c40000;font-weight:900;margin-left:8px}
.divider{border:0;border-top:1px solid #ddd;margin:15px 0}.delivery{margin:18px 0;border:1px solid var(--border);background:#f7fafa;padding:14px;font-size:14px;line-height:1.75}.section-title{font-size:19px;margin:17px 0 8px}.description{font-size:14px;line-height:1.7;color:#333;white-space:pre-line}.features{font-size:14px;line-height:1.8}
.buybox{border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:18px;max-width:430px}.more-products{margin-top:28px;border-top:1px solid #ddd;padding-top:20px}.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.more-card{border:1px solid var(--border);background:#fff;padding:10px;cursor:pointer}.more-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}.more-card img{width:100%;height:180px;object-fit:contain}.more-card strong{display:block;font-size:14px;margin:8px 0}.more-card .small-price{font-size:17px;font-weight:900}@media(max-width:900px){.more-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.more-grid{grid-template-columns:1fr 1fr}.more-card img{height:130px}}.stock{margin:10px 0;font-weight:800;color:#007600}.stock.low{color:#b12704}.stock.out{color:#c40000}.actions{display:flex;gap:9px}.actions button{flex:1;border-radius:20px;padding:12px;font-weight:900;border:1px solid #aaa;cursor:pointer}.add{background:var(--yellow)}.buy{background:var(--orange)}.loading{text-align:center;padding:80px;font-size:18px}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:12px}.main-image{height:350px}.title{font-size:21px}.price{font-size:26px}.page{padding:10px}.box{padding:14px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="logo" onclick="goBack()">Green <span>Angan</span></div><button class="back" onclick="goBack()">← Back to Products</button></div></header>
<main class="page"><section class="box"><div id="productContent" class="loading">Loading product...</div></section></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAwydVIDNYu6n3ze_yaI-Q9r1Ms6MMCcYM",
 authDomain:"greenangan-7a085.firebaseapp.com",
 databaseURL:"https://greenangan-7a085-default-rtdb.firebaseio.com/",
 projectId:"greenangan-7a085",
 storageBucket:"greenangan-7a085.firebasestorage.app",
 messagingSenderId:"105971440710",
 appId:"1:105971440710:web:32e03bcb5cd2fcf8713347"
};
const app=initializeApp(firebaseConfig), database=getDatabase(app);
const params=new URLSearchParams(location.search);
const productId=params.get("id");

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
window.goBack=()=>{
 const from=document.referrer;
 if(from && !from.includes("product.html")) { location.href=from.includes("#")?from:from+"#productsSection"; }
 else location.href="index.html#productsSection";
};

let allProducts=[];
function getCachedProducts(){
 try{return JSON.parse(localStorage.getItem("green_angan_products"))||[]}catch(e){return[]}
}
async function loadProduct(){
 // Show instantly from cached database products first
 const cached=getCachedProducts();
 if(cached.length){
   allProducts=cached;
   let cachedProduct=cached.find(p=>(p.firebaseKey||"")===productId);
   if(!cachedProduct && /^\d+$/.test(productId||"")) cachedProduct=cached[Number(productId)];
   if(cachedProduct) render(cachedProduct);
 }
 try{
  const snap=await get(ref(database,"products"));
  const data=snap.val()||{};
  const list=Object.keys(data).map(key=>({firebaseKey:key,...data[key]}));
  allProducts=list;
  localStorage.setItem("green_angan_products",JSON.stringify(list));
  let product=list.find(p=>p.firebaseKey===productId);
  if(!product && /^\d+$/.test(productId||"")) product=list[Number(productId)];
  if(!product){
    if(!cached.length) document.getElementById("productContent").innerHTML='<div class="loading">Product not found.</div>';
    return;
  }
  render(product);
 }catch(e){
  if(!cached.length) document.getElementById("productContent").innerHTML='<div class="loading">Unable to load product.</div>';
 }
}
function renderMoreProducts(current){
 const others=allProducts.filter(p=>(p.firebaseKey||p.name)!==(current.firebaseKey||current.name)).slice(0,8);
 if(!others.length) return "";
 return `<div class="more-products"><h2 class="section-title">More Products</h2><div class="more-grid">${
   others.map(p=>{
    const image=Array.isArray(p.images)&&p.images.length?p.images[0]:(p.image||"Logo.png");
    return `<div class="more-card" data-product-id="${esc(p.firebaseKey||"")}" onclick="openOtherProduct(this.dataset.productId)">
      <img src="${esc(image)}" alt="${esc(p.name)}" loading="lazy">
      <strong>${esc(p.name||"Green Angan Product")}</strong>
      <div class="small-price">₹${Number(p.price||0).toLocaleString("en-IN")}</div>
    </div>`;
   }).join("")
 }</div></div>`;
}
window.openOtherProduct=(id)=>{if(!id)return; location.href="product.html?id="+encodeURIComponent(id)};function render(product){
 const price=Number(product.price||0), original=Number(product.originalPrice||Math.round(price*1.4));
 const discount=original>price?Math.round(((original-price)/original)*100):0, stock=Number(product.stock||0);
 const images=Array.isArray(product.images)&&product.images.length?product.images.slice(0,10):[product.image||"Logo.png"];
 const reviews=product.reviews?Object.values(product.reviews):[];
 const avg=reviews.length?(reviews.reduce((a,r)=>a+Number(r.rating||5),0)/reviews.length).toFixed(1):"5.0";
 const features=Array.isArray(product.features)?product.features.filter(Boolean):[];
 const stockClass=stock<=0?"out":stock<=5?"low":"";
 const stockText=stock<=0?"Currently unavailable":stock<=5?`Only ${stock} left in stock`:`In Stock: ${stock} ${esc(product.unit||"PC")}`;
 document.getElementById("productContent").className="";
 document.getElementById("productContent").innerHTML=`<div class="layout">
  <div><div class="main-image"><img id="mainImage" src="${esc(images[0])}" alt="${esc(product.name)}"></div>
  <div class="thumbs">${images.map((img,i)=>`<img src="${esc(img)}" class="thumb ${i===0?"active":""}" onclick="changeImage('${esc(img)}',this)">`).join("")}</div></div>
  <div><h1 class="title">${esc(product.name||"Green Angan Product")}</h1>
  ${product.brand?`<div class="brand">Brand: ${esc(product.brand)}</div>`:""}
  <div class="rating">⭐ ${avg} / 5</div> <span style="font-size:13px;color:#007185">${reviews.length} customer reviews</span>
  <hr class="divider"><div><span class="price">₹${price.toLocaleString("en-IN")}</span><span class="old">₹${original.toLocaleString("en-IN")}</span><span class="discount">${discount}% off</span></div>
  <div style="font-size:12px;color:#667085;margin-top:4px">Inclusive of applicable taxes</div>
  <div class="delivery"><strong>🚚 FREE Delivery</strong><br>Delivery available for your location<br><strong>💵 Cash on Delivery available</strong><br>Unit: ${esc(product.unit||"PC")}</div>
  <h2 class="section-title">About this product</h2><div class="description">${esc(product.description||"Fresh and quality product supplied by Green Angan.")}</div>
  ${features.length?`<h2 class="section-title">Key Features</h2><ul class="features">${features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
  <div class="buybox"><div class="stock ${stockClass}">${stockText}</div>
  ${stock>0?`<div class="actions"><button class="add" onclick="addToCart()">🛒 Add to Cart</button><button class="buy" onclick="buyNow()">⚡ Buy Now</button></div>`:`<button disabled style="width:100%;padding:12px;border:0;border-radius:20px">Sold Out</button>`}</div></div></div>`;
 document.getElementById("productContent").insertAdjacentHTML("beforeend", renderMoreProducts(product));
 window.currentProduct=product;
}
window.changeImage=(src,el)=>{document.getElementById("mainImage").src=src;document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function cartKey(){const c=JSON.parse(localStorage.getItem("current_green_angan_customer")||"null");return "green_angan_cart_"+(c?.phone||"guest")}
window.addToCart=()=>{const p=window.currentProduct;if(!p)return;let c=JSON.parse(localStorage.getItem(cartKey())||"[]");const found=c.find(x=>(x.firebaseKey||x.name)===(p.firebaseKey||p.name));if(found)found.qty=Number(found.qty||0)+1;else c.push({...p,qty:1});localStorage.setItem(cartKey(),JSON.stringify(c));alert("✓ Added to Cart");}
window.buyNow=()=>{addToCart();location.href="index.html#productsSection";}
loadProduct();
</script>
</body></html>
